name: absensi
description: "ASIQ - Aplikasi Absensi Siswa Berbasis QR Code"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Komunikasi ke Apps Script Web App
  http: ^1.2.2

  # Generate & scan QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Kartu ID / export & bagikan gambar (Tahap 2)
  path_provider: ^2.1.0
  share_plus: ^10.0.0

  # Buka link rekap bulanan di browser
  url_launcher: ^6.3.0

  # Simpan sesi login supaya tidak logout tiap app ditutup
  shared_preferences: ^2.3.3

  # Google Fonts untuk splash screen
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - asset/home_icon.jpeg

flutter_icons:
  android: true
  ios: true
  image_path: "asset/home_icon.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/home_icon.jpeg"